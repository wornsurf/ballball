<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BallBall - Director's Cut</title>
    <link rel="icon" href="BallBallGIF-FolderIcon.png">
    <style>
:root {
  color-scheme: dark;
  background: #05070b;
}

* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
}

body {
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 50% 42%, rgba(38, 58, 70, 0.45), transparent 46%),
    #05070b;
  font-family: "Courier New", Courier, monospace;
}

.game-shell {
  display: grid;
  place-items: center;
  width: 100vw;
  height: 100vh;
  padding: clamp(8px, 1.5vw, 20px);
}

#game {
  display: block;
  width: min(100vw, calc(100vh * 16 / 9));
  height: min(100vh, calc(100vw * 9 / 16));
  max-width: 1280px;
  max-height: 720px;
  background: #000;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  outline: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 22px 80px rgba(0, 0, 0, 0.72);
  touch-action: none;
  user-select: none;
}
    </style>
  </head>
  <body>
    <main class="game-shell" aria-label="BallBall browser game">
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="BallBall game canvas"></canvas>
    </main>
    <script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;
const GROUND_Y = 626;
const BALL_RADIUS = 52;
const SCORE_KEY = "ballball-best-score";
const RECORD_SCORE = 484;

const assets = {
  title: "assets/title.png?v=5",
  background: "assets/background_play.png?v=5",
  ball: "assets/ball.png?v=5",
  playerIdle: "assets/player_idle.png?v=5",
  playerRun: "assets/player_run.png?v=5",
  playerKick: "assets/player_kick.png?v=5",
};

const images = {};
const keys = new Set();
const heldButtons = new Map();
const particles = [];

let loaded = 0;
let state = "loading";
let lastTime = performance.now();
let score = 0;
let best = Number(localStorage.getItem(SCORE_KEY) || 0);
let streakType = "";
let streakTimer = 0;
let flash = 0;
let missFlash = 0;
let shake = 0;
let countdownTimer = 0;
let audioContext = null;
let masterGain = null;
let music = null;

const player = {
  x: 330,
  y: GROUND_Y,
  vx: 0,
  vy: 0,
  facing: 1,
  onGround: true,
  action: "idle",
  actionTimer: 0,
};

const ball = {
  x: 540,
  y: 214,
  vx: 145,
  vy: 0,
  angle: 0,
  spin: 2.4,
};

const controls = [
  { id: "left", x: 72, y: 604, r: 42 },
  { id: "right", x: 172, y: 604, r: 42 },
  { id: "up", x: 122, y: 532, r: 42 },
  { id: "kick", x: 1160, y: 590, r: 56 },
];

for (const [name, src] of Object.entries(assets)) {
  const image = new Image();
  image.onload = () => {
    loaded += 1;
    if (loaded === Object.keys(assets).length) {
      state = "title";
      requestAnimationFrame(loop);
    }
  };
  image.src = src;
  images[name] = image;
}

function resetGame() {
  score = 0;
  streakType = "";
  streakTimer = 0;
  flash = 0;
  missFlash = 0;
  shake = 0;
  particles.length = 0;

  player.x = 330;
  player.y = GROUND_Y;
  player.vx = 0;
  player.vy = 0;
  player.facing = 1;
  player.onGround = true;
  player.action = "idle";
  player.actionTimer = 0;

  ball.x = 540;
  ball.y = 214;
  ball.vx = 0;
  ball.vy = 0;
  ball.angle = -0.4;
  ball.spin = 2.4;
}

function startGame() {
  resetGame();
  countdownTimer = 3;
  state = "countdown";
  lastTime = performance.now();
  unlockAudio();
  startMusic();
}

function update(dt) {
  if (state === "countdown") {
    updatePlayer(dt);
    updateParticles(dt);
    tickEffects(dt);
    countdownTimer = Math.max(0, countdownTimer - dt);
    if (countdownTimer === 0) {
      state = "playing";
      ball.vx = player.x < ball.x ? 145 : -145;
      ball.vy = 28;
    }
    return;
  }

  if (state !== "playing") {
    updateParticles(dt);
    return;
  }

  updatePlayer(dt);
  updateBall(dt);
  updateParticles(dt);
  tickEffects(dt);
}

function tickEffects(dt) {
  flash = Math.max(0, flash - dt);
  missFlash = Math.max(0, missFlash - dt);
  shake = Math.max(0, shake - dt * 38);
  streakTimer = Math.max(0, streakTimer - dt);
}

function updatePlayer(dt) {
  const left = keys.has("ArrowLeft") || isHeld("left");
  const right = keys.has("ArrowRight") || isHeld("right");
  const jump = keys.has("ArrowUp") || isHeld("up");
  const move = (right ? 1 : 0) - (left ? 1 : 0);
  const maxSpeed = 360;
  const accel = player.onGround ? 2100 : 1100;
  const drag = player.onGround ? 0.82 : 0.965;

  if (move) {
    player.vx += move * accel * dt;
    player.facing = move;
  } else {
    player.vx *= Math.pow(drag, dt * 60);
  }

  player.vx = clamp(player.vx, -maxSpeed, maxSpeed);
  player.x += player.vx * dt;
  player.x = clamp(player.x, 126, W - 148);

  if (jump && player.onGround) {
    player.vy = -560;
    player.onGround = false;
    player.action = "jump";
    player.actionTimer = 0.22;
  }

  if (!player.onGround) {
    player.vy += 1450 * dt;
    player.y += player.vy * dt;
    if (player.y >= GROUND_Y) {
      player.y = GROUND_Y;
      player.vy = 0;
      player.onGround = true;
    }
  }

  if (player.actionTimer > 0) {
    player.actionTimer -= dt;
  } else if (!player.onGround) {
    player.action = "jump";
  } else if (Math.abs(player.vx) > 45) {
    player.action = "run";
  } else {
    player.action = "idle";
  }
}

function updateBall(dt) {
  const gravity = 1040 + Math.min(score * 9, 260);
  ball.vy += gravity * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.angle += ball.spin * dt;
  ball.vx *= Math.pow(0.994, dt * 60);

  const leftWall = 40 + BALL_RADIUS;
  const rightWall = W - 40 - BALL_RADIUS;
  const ceiling = 74 + BALL_RADIUS;

  if (ball.x < leftWall) {
    ball.x = leftWall;
    ball.vx = Math.abs(ball.vx) * 0.88;
    ball.spin = Math.abs(ball.spin) + 0.7;
  }

  if (ball.x > rightWall) {
    ball.x = rightWall;
    ball.vx = -Math.abs(ball.vx) * 0.88;
    ball.spin = -Math.abs(ball.spin) - 0.7;
  }

  if (ball.y < ceiling) {
    ball.y = ceiling;
    ball.vy = Math.abs(ball.vy) * 0.58;
  }

  resolveBodyTouches();

  if (ball.y + BALL_RADIUS >= GROUND_Y) {
    ball.y = GROUND_Y - BALL_RADIUS;
    endGame();
  }
}

function resolveBodyTouches() {
  if (player.action === "kick" && player.actionTimer > 0.04) {
    tryKick("foot");
    return;
  }

  const body = playerPoint("body");
  const head = playerPoint("head");
  const knee = playerPoint("knee");

  if (ball.vy > -260 && dist(ball, head) < BALL_RADIUS + 42 && ball.y < player.y - 210) {
    registerTouch("nog", head, 0.78);
    return;
  }

  if (ball.vy > -180 && dist(ball, knee) < BALL_RADIUS + 32 && ball.y > player.y - 182) {
    registerTouch("tiny toes", knee, 0.58);
    return;
  }

  if (ball.vy > -120 && dist(ball, body) < BALL_RADIUS + 50 && ball.y > player.y - 288) {
    registerTouch("belly", body, 0.45);
  }
}

function triggerKick() {
  if (state === "title" || state === "over") {
    startGame();
    return;
  }

  if (state !== "playing") {
    if (state === "countdown") {
      player.action = "kick";
      player.actionTimer = 0.18;
      playMiss();
    }
    return;
  }

  player.action = "kick";
  player.actionTimer = 0.22;
  tryKick("foot");
}

function tryKick(kind) {
  const foot = playerPoint("foot");
  const hitRange = BALL_RADIUS + 118;

  if (dist(ball, foot) > hitRange || ball.vy < -620) {
    missFlash = 0.15;
    playMiss();
    return false;
  }

  registerTouch(kind, foot, 1);
  return true;
}

function registerTouch(kind, contact, power) {
  const dx = ball.x - contact.x;
  const dy = ball.y - contact.y;
  const aim = keys.has("ArrowLeft") || isHeld("left") ? -1 : keys.has("ArrowRight") || isHeld("right") ? 1 : player.facing;
  const tiny = keys.has("ArrowDown") || isHeld("kick");
  const lift = kind === "nog" ? 650 : kind === "belly" ? 570 : tiny ? 560 : 780;
  const horizontal = clamp(dx * 2.1 + aim * (tiny ? 95 : 175) + player.vx * 0.35, -560, 560);
  const bonus = Math.min(score * 8, 170);

  ball.x += dx ? Math.sign(dx) * 4 : aim * 4;
  ball.y += dy ? Math.sign(dy) * 3 : -4;
  ball.vx = horizontal;
  ball.vy = -lift - bonus * power;
  ball.spin = clamp(ball.vx / 75, -8, 8);

  score += 1;
  if (score > best) {
    best = score;
    localStorage.setItem(SCORE_KEY, String(best));
  }

  streakType = kind === "nog" ? "ST. NOG" : kind === "tiny toes" || tiny ? "TINY TOES" : "BALLBALL";
  streakTimer = 0.8;
  flash = 0.2;
  shake = kind === "foot" ? 8 : 5;
  spawnBurst(contact.x, contact.y, kind);
  playKick(kind);
}

function endGame() {
  if (state !== "playing") {
    return;
  }

  state = "over";
  shake = 14;
  stopMusic();
  playDrop();
}

function draw() {
  ctx.save();
  ctx.clearRect(0, 0, W, H);

  if (shake > 0) {
    const amount = Math.min(shake, 10);
    ctx.translate(
      Math.sin(performance.now() * 0.055) * amount,
      Math.cos(performance.now() * 0.05) * amount * 0.55,
    );
  }

  if (state === "title" || state === "loading") {
    ctx.drawImage(images.title || images.background, 0, 0, W, H);
    ctx.restore();
    return;
  }

  ctx.drawImage(images.background, 0, 0, W, H);
  drawPlayerShadow();
  drawBallShadow();

  if (ball.y < player.y - 210) {
    drawBall();
    drawPlayer();
  } else {
    drawPlayer();
    drawBall();
  }

  drawParticles();
  drawKickEffects();
  drawScore();
  drawControls();

  if (state === "countdown") {
    drawCountdown();
  }

  if (state === "over") {
    drawGameOver();
  }

  ctx.restore();
}

function drawPlayer() {
  const pose = player.action === "kick" && player.actionTimer > 0 ? images.playerKick : Math.abs(player.vx) > 45 ? images.playerRun : images.playerIdle;
  const scale = 1;
  const drawX = player.action === "kick" ? -112 : Math.abs(player.vx) > 45 ? -92 : -88;
  const drawY = player.action === "kick" ? -356 : Math.abs(player.vx) > 45 ? -345 : -360;

  ctx.save();
  ctx.translate(Math.round(player.x), Math.round(player.y));
  ctx.scale(player.facing, 1);
  ctx.drawImage(pose, drawX * scale, drawY * scale, pose.width * scale, pose.height * scale);
  ctx.restore();
}

function drawBall() {
  const size = BALL_RADIUS * 2;
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.angle);
  ctx.drawImage(images.ball, -BALL_RADIUS, -BALL_RADIUS, size, size);
  ctx.restore();
}

function drawPlayerShadow() {
  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = "#111820";
  ctx.beginPath();
  ctx.ellipse(player.x + 8, GROUND_Y + 7, 76, 17, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawBallShadow() {
  const height = Math.max(0, GROUND_Y - ball.y);
  const scale = clamp(1 - height / 620, 0.18, 0.86);
  ctx.save();
  ctx.globalAlpha = 0.28 * scale;
  ctx.fillStyle = "#111820";
  ctx.beginPath();
  ctx.ellipse(ball.x, GROUND_Y + 6, 64 * scale, 18 * scale, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawKickEffects() {
  if (flash > 0) {
    const foot = playerPoint("foot");
    const t = flash / 0.2;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.strokeStyle = "#fff7bd";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(foot.x, foot.y, 30 + (1 - t) * 44, -0.85, 1.15);
    ctx.stroke();
    ctx.strokeStyle = "#ff8b2d";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(foot.x, foot.y, 48 + (1 - t) * 26, -0.65, 0.9);
    ctx.stroke();
    ctx.restore();
  }

  if (missFlash > 0) {
    const foot = playerPoint("foot");
    const t = missFlash / 0.15;
    ctx.save();
    ctx.globalAlpha = 0.6 * t;
    ctx.strokeStyle = "#c7e7ff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(foot.x, foot.y, 28 + (1 - t) * 22, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

function drawScore() {
  drawPixelText(String(score).padStart(2, "0"), W - 132, 98, 56, "right");
  drawPixelText(`BEST ${String(best).padStart(2, "0")}`, 54, 82, 22, "left");
  drawPixelText(`RECORD ${RECORD_SCORE}`, 54, 113, 20, "left");

  if (streakTimer > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, streakTimer * 2.2);
    drawPixelText(streakType, W / 2, 104, 34, "center");
    ctx.restore();
  }
}

function drawGameOver() {
  ctx.save();
  ctx.fillStyle = "rgba(2, 4, 8, 0.58)";
  ctx.fillRect(0, 0, W, H);
  drawPixelText("GAME OVER", W / 2, 286, 58, "center");
  drawPixelText(`SCORE ${String(score).padStart(2, "0")}`, W / 2, 366, 34, "center");
  drawPixelText(`BEST ${String(best).padStart(2, "0")}`, W / 2, 414, 30, "center");
  drawPixelText("BALLBALL", W / 2, 474, 26, "center");
  ctx.restore();
}

function drawCountdown() {
  const label = countdownTimer > 2 ? "READY" : countdownTimer > 1 ? "SET" : "GO";
  const scale = 1 + Math.sin(performance.now() * 0.014) * 0.035;

  ctx.save();
  ctx.fillStyle = "rgba(2, 4, 8, 0.26)";
  ctx.fillRect(0, 0, W, H);
  ctx.translate(W / 2, 284);
  ctx.scale(scale, scale);
  drawPixelText(label, 0, 0, label === "GO" ? 84 : 72, "center");
  ctx.restore();
}

function drawControls() {
  ctx.save();
  for (const control of controls) {
    const active = control.id === "kick" ? player.action === "kick" || isHeld("kick") : isHeld(control.id);
    ctx.globalAlpha = active ? 0.78 : 0.38;
    ctx.fillStyle = active ? "#f7f2c0" : "#0d1620";
    ctx.strokeStyle = active ? "#351b36" : "#b6d8e8";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(control.x, control.y, control.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.globalAlpha = active ? 0.95 : 0.72;
    ctx.fillStyle = active ? "#351b36" : "#ffffff";
    if (control.id === "kick") {
      drawBootIcon(control.x, control.y);
    } else {
      drawArrowIcon(control.x, control.y, control.id);
    }
  }
  ctx.restore();
}

function drawArrowIcon(x, y, id) {
  ctx.save();
  ctx.translate(x, y);
  if (id === "left") {
    ctx.rotate(Math.PI);
  } else if (id === "up") {
    ctx.rotate(-Math.PI / 2);
  }
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-10, -18);
  ctx.lineTo(-10, -7);
  ctx.lineTo(-24, -7);
  ctx.lineTo(-24, 7);
  ctx.lineTo(-10, 7);
  ctx.lineTo(-10, 18);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawBootIcon(x, y) {
  ctx.save();
  ctx.translate(x - 28, y - 18);
  ctx.beginPath();
  ctx.moveTo(7, 1);
  ctx.lineTo(38, 1);
  ctx.lineTo(42, 25);
  ctx.lineTo(62, 26);
  ctx.lineTo(66, 38);
  ctx.lineTo(23, 42);
  ctx.lineTo(9, 27);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  ctx.save();
  for (const particle of particles) {
    ctx.globalAlpha = particle.life / particle.maxLife;
    ctx.fillStyle = particle.color;
    ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
  }
  ctx.restore();
}

function drawPixelText(text, x, y, size, align) {
  ctx.save();
  ctx.font = `900 ${size}px "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.miterLimit = 2;
  ctx.strokeStyle = "#1b2430";
  ctx.lineWidth = Math.max(5, size * 0.13);
  ctx.strokeText(text, x, y);
  ctx.fillStyle = "#f8fbff";
  ctx.fillText(text, x, y);
  ctx.restore();
}

function loop(now) {
  const dt = Math.min(0.032, (now - lastTime) / 1000);
  lastTime = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function playerPoint(kind) {
  const facing = player.facing;
  if (kind === "foot") {
    const kicking = player.action === "kick" && player.actionTimer > 0;
    return { x: player.x + facing * (kicking ? 120 : 70), y: player.y - (kicking ? 102 : 64) };
  }
  if (kind === "knee") {
    return { x: player.x + facing * 54, y: player.y - 156 };
  }
  if (kind === "head") {
    return { x: player.x + facing * 16, y: player.y - 300 };
  }
  return { x: player.x + facing * 22, y: player.y - 212 };
}

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function isHeld(id) {
  for (const held of heldButtons.values()) {
    if (held === id) {
      return true;
    }
  }
  return false;
}

function spawnBurst(x, y, kind) {
  const colors = kind === "nog" ? ["#9ff0ff", "#ffffff", "#ffd36a"] : ["#fff7bd", "#ff8b2d", "#71e7ff"];
  for (let i = 0; i < 12; i += 1) {
    const angle = (Math.PI * 2 * i) / 12 + Math.random() * 0.2;
    particles.push({
      x,
      y,
      vx: Math.cos(angle) * (80 + Math.random() * 160),
      vy: Math.sin(angle) * (80 + Math.random() * 160),
      life: 0.32 + Math.random() * 0.22,
      maxLife: 0.52,
      size: 4 + Math.random() * 5,
      color: colors[i % colors.length],
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i -= 1) {
    const particle = particles[i];
    particle.life -= dt;
    particle.x += particle.vx * dt;
    particle.y += particle.vy * dt;
    particle.vy += 260 * dt;
    if (particle.life <= 0) {
      particles.splice(i, 1);
    }
  }
}

function unlockAudio() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioContext.createGain();
    masterGain.gain.value = 0.17;
    masterGain.connect(audioContext.destination);
  }
  if (audioContext.state === "suspended") {
    audioContext.resume();
  }
}

function startMusic() {
  if (!audioContext || music) {
    return;
  }
  music = createBallBallPopLoop();
  music.start();
}

function stopMusic() {
  if (!music) {
    return;
  }
  music.stop();
  music = null;
}

function createBallBallPopLoop() {
  const tempo = 122;
  const beat = 60 / tempo;
  const notes = {
    C3: 130.81,
    D3: 146.83,
    E3: 164.81,
    G3: 196,
    A3: 220,
    C4: 261.63,
    D4: 293.66,
    E4: 329.63,
    G4: 392,
    A4: 440,
    B4: 493.88,
    C5: 523.25,
    D5: 587.33,
    E5: 659.25,
    G5: 783.99,
  };

  const lead = ["E5", "D5", "C5", "D5", "G5", "E5", "D5", "C5"];
  const bass = ["C3", "C3", "G3", "G3", "A3", "A3", "E3", "G3"];
  let timer = 0;
  let step = 0;
  let stopped = false;

  function schedule() {
    if (stopped || !audioContext) {
      return;
    }

    const now = audioContext.currentTime + 0.03;
    const leadNote = notes[lead[step % lead.length]];
    const bassNote = notes[bass[Math.floor(step / 2) % bass.length]];

    tone(leadNote, now, beat * 0.42, "triangle", 0.075, 0.01);
    if (step % 2 === 0) {
      tone(bassNote, now, beat * 0.8, "sawtooth", 0.035, 0.03);
    }
    if (step % 4 === 2) {
      tone(notes.C5, now + beat * 0.32, beat * 0.16, "square", 0.028, 0.005);
    }
    noise(now, 0.035, step % 2 === 0 ? 0.048 : 0.026);

    step += 1;
    timer = window.setTimeout(schedule, beat * 1000);
  }

  return {
    start: schedule,
    stop() {
      stopped = true;
      window.clearTimeout(timer);
    },
  };
}

function tone(frequency, start, duration, type, volume, attack) {
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();
  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);
  gain.gain.setValueAtTime(0.001, start);
  gain.gain.linearRampToValueAtTime(volume, start + attack);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  oscillator.connect(gain);
  gain.connect(masterGain);
  oscillator.start(start);
  oscillator.stop(start + duration + 0.03);
}

function noise(start, duration, volume) {
  const length = Math.max(1, Math.floor(audioContext.sampleRate * duration));
  const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i += 1) {
    data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2);
  }

  const source = audioContext.createBufferSource();
  const gain = audioContext.createGain();
  const filter = audioContext.createBiquadFilter();
  filter.type = "highpass";
  filter.frequency.value = 4800;
  gain.gain.setValueAtTime(volume, start);
  gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
  source.buffer = buffer;
  source.connect(filter);
  filter.connect(gain);
  gain.connect(masterGain);
  source.start(start);
}

function blip(frequency, duration, type, gainValue) {
  if (!audioContext) {
    return;
  }
  tone(frequency, audioContext.currentTime, duration, type, gainValue, 0.003);
}

function playKick(kind) {
  const base = kind === "nog" ? 620 : kind === "belly" ? 210 : 300;
  blip(base, 0.08, "square", 0.08);
  window.setTimeout(() => blip(base * 1.62, 0.05, "triangle", 0.04), 28);
}

function playMiss() {
  blip(95, 0.055, "sine", 0.035);
}

function playDrop() {
  blip(65, 0.16, "sawtooth", 0.06);
}

canvas.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  canvas.focus();
  const point = getCanvasPoint(event);
  const button = hitControl(point);
  if (button) {
    heldButtons.set(event.pointerId, button.id);
    nudgeControl(button.id);
    if (button.id === "kick") {
      triggerKick();
    }
    canvas.setPointerCapture(event.pointerId);
    return;
  }
  triggerKick();
});

canvas.addEventListener("pointermove", (event) => {
  if (!heldButtons.has(event.pointerId)) {
    return;
  }
  const point = getCanvasPoint(event);
  const button = hitControl(point);
  heldButtons.set(event.pointerId, button ? button.id : "");
});

canvas.addEventListener("pointerup", (event) => {
  heldButtons.delete(event.pointerId);
});

canvas.addEventListener("pointercancel", (event) => {
  heldButtons.delete(event.pointerId);
});

window.addEventListener("keydown", (event) => {
  if (isControlKey(event.code)) {
    event.preventDefault();
    nudgeControl(event.code);
    if (!keys.has(event.code) && (event.code === "Space" || event.code === "Enter" || event.code === "ArrowDown")) {
      triggerKick();
    }
    keys.add(event.code);
  }
});

window.addEventListener("keyup", (event) => {
  if (isControlKey(event.code)) {
    event.preventDefault();
    keys.delete(event.code);
  }
});

function isControlKey(code) {
  return code === "ArrowLeft" || code === "ArrowRight" || code === "ArrowUp" || code === "ArrowDown" || code === "Space" || code === "Enter";
}

function nudgeControl(code) {
  if (state !== "playing" && state !== "countdown") {
    return;
  }

  if (code === "ArrowLeft" || code === "left") {
    player.vx = clamp(player.vx - 145, -360, 360);
    player.x = clamp(player.x - 14, 126, W - 148);
    player.facing = -1;
  } else if (code === "ArrowRight" || code === "right") {
    player.vx = clamp(player.vx + 145, -360, 360);
    player.x = clamp(player.x + 14, 126, W - 148);
    player.facing = 1;
  } else if ((code === "ArrowUp" || code === "up") && player.onGround) {
    player.vy = -560;
    player.onGround = false;
    player.action = "jump";
    player.actionTimer = 0.22;
  }
}

function hitControl(point) {
  return controls.find((control) => Math.hypot(point.x - control.x, point.y - control.y) <= control.r);
}

function getCanvasPoint(event) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: ((event.clientX - rect.left) / rect.width) * W,
    y: ((event.clientY - rect.top) / rect.height) * H,
  };
}
